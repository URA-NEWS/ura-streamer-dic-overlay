<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
      color: #fff;
      font-size: 12px;
      height: 100vh;
      overflow: hidden;
    }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .controls-bar {
      background: linear-gradient(135deg, #1a0f2e 0%, #2d1b4e 100%);
      padding: 8px 10px;
      border-bottom: 1px solid rgba(79, 195, 247, 0.15);
      flex-shrink: 0;
    }
    .controls-row {
      display: flex;
      gap: 4px;
      margin-bottom: 6px;
    }
    .controls-row button {
      flex: 1;
      padding: 5px 4px;
      font-size: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: linear-gradient(135deg, #4fc3f7, #29b6f6);
      color: #fff;
      font-weight: 600;
    }
    .controls-row button:hover { opacity: 0.9; }
    .controls-row button.danger { background: linear-gradient(135deg, #f44336, #e91e63); }
    .volume-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .volume-row span:first-child { font-size: 12px; }
    .volume-row input[type="range"] { flex: 1; }
    .volume-row .vol-value { font-size: 9px; width: 28px; text-align: right; color: rgba(255,255,255,0.6); }
    .sync-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
    }
    .sync-row .status-msg { flex: 1; color: rgba(255,255,255,0.5); }
    .sync-row .status-msg.ok { color: #4caf50; }
    .sync-row .status-msg.err { color: #f44336; }
    .sync-row button {
      padding: 3px 8px;
      font-size: 9px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      background: rgba(79, 195, 247, 0.2);
      color: #fff;
      white-space: nowrap;
    }
    .sync-row button:hover { background: rgba(79, 195, 247, 0.4); }
    .search-bar { padding: 8px 10px; border-bottom: 1px solid rgba(79, 195, 247, 0.1); flex-shrink: 0; }
    .search-bar input {
      width: 100%;
      padding: 7px 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
    .video-grid {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .video-card {
      background: linear-gradient(135deg, rgba(45, 27, 78, 0.6), rgba(79, 195, 247, 0.1));
      padding: 8px 10px;
      border: 1px solid rgba(79, 195, 247, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .video-card:hover { border-color: #4fc3f7; }
    .video-thumb {
      width: 60px; height: 34px;
      background: #000;
      border-radius: 4px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      overflow: hidden;
    }
    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-info { flex: 1; min-width: 0; }
    .video-title {
      font-weight: 600; font-size: 12px; margin-bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .video-meta { font-size: 9px; color: rgba(255,255,255,0.5); }
    .video-btns { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
    .video-btns button {
      padding: 5px 8px; font-size: 10px; border: none; border-radius: 4px;
      cursor: pointer; background: rgba(79, 195, 247, 0.2); color: #fff;
      white-space: nowrap;
    }
    .video-btns button:hover { background: rgba(79, 195, 247, 0.4); }
    .loop-toggle {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .loop-toggle input { cursor: pointer; }
    .empty { text-align: center; padding: 30px 20px; color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="controls-bar">
      <div class="controls-row">
        <button id="pauseBtn">⏸ 一時停止</button>
        <button id="resumeBtn">▶ 再開</button>
        <button class="danger" id="stopBtn">⏹ 停止</button>
      </div>
      <div class="volume-row">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="100" value="100">
        <span id="volumeValue" class="vol-value">100%</span>
      </div>
      <div class="sync-row">
        <span class="status-msg" id="statusMsg">確認中...</span>
        <button id="refreshBtn">🔄 更新</button>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="検索...">
    </div>

    <div class="video-grid" id="videoGrid">
      <div class="empty">読み込み中...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://hidden-darkness-f35b.infoura-news.workers.dev';
    const R2_BASE = 'https://pub-b72df996089b47909888246eb5c62875.r2.dev';

    let videos = [];
    let loopSettings = {};
    const PLAY_KEY = 'videoLib_play';
    const CONTROL_KEY = 'videoLib_control';
    const LOOP_KEY = 'videoLib_loopSettings';

    let channel = null;
    try {
      channel = new BroadcastChannel('video_library_channel');
    } catch (e) {
      console.warn('BroadcastChannel not supported');
    }

    function loadLoopSettings() {
      try {
        const raw = localStorage.getItem(LOOP_KEY);
        loopSettings = raw ? JSON.parse(raw) : {};
      } catch (e) {
        loopSettings = {};
      }
    }

    function saveLoopSettings() {
      localStorage.setItem(LOOP_KEY, JSON.stringify(loopSettings));
    }

    async function fetchVideos() {
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.textContent = '確認中...';
      statusMsg.className = 'status-msg';

      try {
        const res = await fetch(`${API_URL}/list`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        videos = (data.files || []).map(f => ({
          id: f.name,
          title: f.name.replace(/\.[^.]+$/, ''),
          url: `${R2_BASE}/${f.name}`,
          size: f.size,
          thumb: null,
        }));

        statusMsg.textContent = `✓ ${videos.length}本の動画を検出`;
        statusMsg.className = 'status-msg ok';
        render();
        videos.forEach(generateThumbnail);
      } catch (e) {
        statusMsg.textContent = '✗ 取得失敗: ' + e.message;
        statusMsg.className = 'status-msg err';
        console.error(e);
      }
    }

    function generateThumbnail(v) {
      const tempVideo = document.createElement('video');
      tempVideo.crossOrigin = 'anonymous';
      tempVideo.muted = true;
      tempVideo.preload = 'metadata';
      tempVideo.src = v.url;

      const onLoaded = () => {
        tempVideo.currentTime = Math.min(1, (tempVideo.duration || 2) / 2);
      };
      const onSeeked = () => {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 120;
          canvas.height = 68;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
          v.thumb = canvas.toDataURL('image/jpeg', 0.6);
          updateThumbInDom(v.id, v.thumb);
        } catch (e) {
          console.warn('サムネイル生成失敗:', v.title, e.message);
        }
        tempVideo.remove();
      };

      tempVideo.addEventListener('loadedmetadata', onLoaded, { once: true });
      tempVideo.addEventListener('seeked', onSeeked, { once: true });
      tempVideo.addEventListener('error', () => {
        console.warn('サムネイル動画読み込み失敗:', v.title);
      }, { once: true });
    }

    function updateThumbInDom(id, dataUrl) {
      const el = document.querySelector(`.video-thumb[data-id="${cssEscape(id)}"]`);
      if (el && dataUrl) {
        el.innerHTML = `<img src="${dataUrl}" alt="">`;
      }
    }

    function cssEscape(str) {
      return str.replace(/["\\]/g, '\\$&');
    }

    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      let filtered = videos;
      if (search) filtered = filtered.filter(v => v.title.toLowerCase().includes(search));

      const grid = document.getElementById('videoGrid');
      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">動画なし<br>R2にアップロードしてください</div>';
        return;
      }

      grid.innerHTML = '';
      filtered.forEach(v => {
        const isLoop = !!loopSettings[v.id];
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="video-thumb" data-id="${cssEscape(v.id)}">${v.thumb ? `<img src="${v.thumb}" alt="">` : '🎬'}</div>
          <div class="video-info">
            <div class="video-title">${escapeHtml(v.title)}</div>
            <div class="video-meta">${formatSize(v.size)}</div>
          </div>
          <div class="video-btns">
            <label class="loop-toggle">
              <input type="checkbox" class="loop-check" ${isLoop ? 'checked' : ''}>🔁
            </label>
            <button class="play-btn">▶ 再生</button>
          </div>
        `;
        card.querySelector('.play-btn').addEventListener('click', () => playVideo(v.id));
        card.querySelector('.loop-check').addEventListener('change', (e) => {
          loopSettings[v.id] = e.target.checked;
          saveLoopSettings();
        });
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function playVideo(id) {
      const v = videos.find(x => x.id === id);
      if (!v) return;
      const loop = !!loopSettings[id];
      const payload = { id: v.id, url: v.url, title: v.title, loop, timestamp: Date.now() };
      localStorage.setItem(PLAY_KEY, JSON.stringify(payload));
      window.dispatchEvent(new StorageEvent('storage', { key: PLAY_KEY, newValue: JSON.stringify(payload) }));
      if (channel) channel.postMessage(payload);
    }

    function sendControl(action, value) {
      const payload = { action, value, timestamp: Date.now() };
      localStorage.setItem(CONTROL_KEY, JSON.stringify(payload));
      window.dispatchEvent(new StorageEvent('storage', { key: CONTROL_KEY, newValue: JSON.stringify(payload) }));
      if (channel) channel.postMessage({ type: 'control', action, value });
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('refreshBtn').addEventListener('click', fetchVideos);
    document.getElementById('pauseBtn').addEventListener('click', () => sendControl('pause'));
    document.getElementById('resumeBtn').addEventListener('click', () => sendControl('resume'));
    document.getElementById('stopBtn').addEventListener('click', () => sendControl('stop'));

    const volumeSlider = document.getElementById('volumeSlider');
    const volumeValue = document.getElementById('volumeValue');
    const VOLUME_KEY = 'videoLib_volume';

    const savedVolume = localStorage.getItem(VOLUME_KEY);
    if (savedVolume !== null) {
      volumeSlider.value = savedVolume;
      volumeValue.textContent = savedVolume + '%';
    }

    volumeSlider.addEventListener('input', () => {
      const vol = volumeSlider.value;
      volumeValue.textContent = vol + '%';
      localStorage.setItem(VOLUME_KEY, vol);
      sendControl('volume', Number(vol) / 100);
    });

    loadLoopSettings();
    fetchVideos();
    setInterval(fetchVideos, 15000);
  </script>
</body>
</html>
