<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信者図鑑 Dock</title>
<style>
:root{
  --bg:#04060d; --panel:#0c1830; --panel-2:#12233f; --line:#2a4468;
  --cyan:#12f5ff; --magenta:#ff2fb0; --green:#39ff9d; --text:#fff; --dim:#cfe0f5;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;padding:10px;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--dim);cursor:pointer;font-weight:700;font-size:13px}
.tab.active{background:var(--cyan);color:#001217;border-color:var(--cyan)}
.pane{display:none}
.pane.active{display:block}
h3{font-size:13px;color:var(--green);margin:12px 0 6px;letter-spacing:.05em}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit
}
input:focus,textarea:focus{outline:none;border-color:var(--green)}
textarea{min-height:70px;resize:vertical}
.gojuon{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.gbtn{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;color:var(--dim);cursor:pointer;font-size:12px;font-weight:700}
.gbtn.active{background:var(--cyan);color:#001217}
.list{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.item{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item:hover{background:var(--panel)}
.item.sel{background:rgba(18,245,255,.15);border-left:3px solid var(--green)}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);flex-shrink:0;background:var(--panel)}
.av.no{display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.nm{font-weight:700;font-size:13px}
.ym{font-size:11px;color:var(--dim)}
.row{display:flex;gap:6px;margin-top:8px}
button.act{flex:1;background:var(--panel);border:1px solid var(--cyan);color:var(--cyan);padding:9px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}
button.act:hover{background:var(--cyan);color:#001217}
button.warn{border-color:var(--magenta);color:var(--magenta)}
button.warn:hover{background:var(--magenta);color:#000}
button.ok{border-color:var(--green);color:var(--green)}
button.ok:hover{background:var(--green);color:#001217}
.scroll-pad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.scroll-pad button{background:var(--panel);border:1px solid var(--line);color:var(--dim);
  padding:10px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700}
.scroll-pad button:hover{border-color:var(--green);color:var(--green)}
.status{font-size:11px;color:var(--dim);margin-top:8px;padding:6px;text-align:center;border-top:1px solid var(--line)}
.sub{border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:6px;background:var(--panel)}
.sub input{margin-bottom:4px}
.mini{background:none;border:1px solid var(--magenta);color:var(--magenta);border-radius:4px;padding:4px 8px;cursor:pointer;font-size:11px}
.preview{width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--green);display:block;margin:6px auto;background:var(--panel)}
label.f{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
.slider-row{display:flex;align-items:center;gap:8px}
.slider-row input[type=range]{flex:1}
.val{min-width:56px;text-align:right;font-size:12px;color:var(--cyan)}
.swatch{height:26px;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.hint{font-size:11px;color:var(--dim);margin-top:3px}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" data-pane="p-show">表示</button>
  <button class="tab" data-pane="p-edit">編集</button>
  <button class="tab" data-pane="p-set">設定</button>
</div>

<div class="pane active" id="p-show">
  <input type="text" id="search" placeholder="配信者名で検索...">
  <div class="gojuon" id="gojuon"></div>
  <div class="list" id="list"></div>

  <h3>オーバーレイ操作</h3>
  <div class="scroll-pad">
    <button id="sc-top">⏫ 先頭へ</button>
    <button id="sc-bottom">⏬ 末尾へ</button>
    <button id="sc-up">▲ 上へ</button>
    <button id="sc-down">▼ 下へ</button>
  </div>
  <div class="row">
    <button class="act warn" id="hideBtn">オーバーレイを非表示</button>
  </div>
  <div class="status" id="status">接続中...</div>
</div>

<div class="pane" id="p-edit">
  <div class="row">
    <button class="act ok" id="newBtn">＋新規</button>
    <button class="act" id="pickBtn">既存を選択</button>
  </div>

  <div class="list" id="editList" style="max-height:150px;margin-top:8px"></div>

  <label class="f">アイコン画像</label>
  <img class="preview" id="preview" src="" alt="">
  <div class="row">
    <button class="act" id="imgBtn">画像を選択</button>
    <button class="act warn" id="imgClear">画像を削除</button>
  </div>
  <input type="file" id="imgFile" accept="image/*" style="display:none">
  <label class="f">または画像URL</label>
  <input type="text" id="f-photo" placeholder="https://...">

  <label class="f">配信者名 *</label>
  <input type="text" id="f-name" placeholder="例：=eru">

  <label class="f">読み仮名（ひらがな・50音索引用）</label>
  <input type="text" id="f-yomi" placeholder="いこえる">

  <h3>SNS</h3>
  <div id="snsWrap"></div>
  <button class="act" id="snsAdd">＋SNS追加</button>

  <h3>配信サイト</h3>
  <div id="siteWrap"></div>
  <button class="act" id="siteAdd">＋配信サイト追加</button>

  <label class="f">紹介文</label>
  <textarea id="f-intro" placeholder="紹介文..."></textarea>

  <div class="row">
    <button class="act ok" id="saveBtn">保存</button>
    <button class="act warn" id="delBtn">この配信者を削除</button>
  </div>
  <div class="row">
    <button class="act" id="exportBtn">streamers.json をダウンロード</button>
  </div>
  <div class="status" id="editStatus">&nbsp;</div>
</div>

<div class="pane" id="p-set">
  <label class="f">オーバーレイ横幅</label>
  <div class="slider-row">
    <input type="range" id="s-width" min="300" max="1280" step="10" value="640">
    <span class="val" id="v-width">640px</span>
  </div>

  <label class="f">背景の不透明度</label>
  <div class="slider-row">
    <input type="range" id="s-bg" min="0" max="100" step="1" value="85">
    <span class="val" id="v-bg">85%</span>
  </div>
  <div class="hint">0%＝完全透過 / 100%＝不透明</div>

  <label class="f">背景の明るさ（黒〜グレー）</label>
  <div class="slider-row">
    <input type="range" id="s-lvl" min="0" max="100" step="1" value="12">
    <span class="val" id="v-lvl">12</span>
  </div>
  <div class="swatch" id="swatch"></div>

  <label class="f">文字サイズ倍率</label>
  <div class="slider-row">
    <input type="range" id="s-font" min="0.8" max="2" step="0.05" value="1">
    <span class="val" id="v-font">1.00x</span>
  </div>

  <div class="status">変更は即座にオーバーレイへ反映されます</div>
</div>

<script>
const $ = id => document.getElementById(id);
let all = [], filtered = [], ws = null, editing = null, gFilter = null;
const gojuonChars = ['あ','か','さ','た','な','は','ま','や','ら','わ'];
const gojuonMap = {
  'あ':'あいうえおぁぃぅぇぉ','か':'かきくけこがぎぐげご','さ':'さしすせそざじずぜぞ',
  'た':'たちつてとだぢづでどっ','な':'なにぬねの','は':'はひふへほばびぶべぼぱぴぷぺぽ',
  'ま':'まみむめも','や':'やゆよゃゅょ','ら':'らりるれろ','わ':'わをんゐゑ'
};

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $(t.dataset.pane).classList.add('active');
    if (t.dataset.pane === 'p-edit') renderEditList();
  };
});

function send(obj){ if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => { send({type:'init', clientType:'dock'}); $('status').textContent = '✓ 接続完了'; };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ack' && m.settings) applySettingsUI(m.settings);
    if (m.type === 'dataUpdated') load();
  };
  ws.onclose = () => { $('status').textContent = '✗ 切断（再接続中）'; setTimeout(connect, 3000); };
  ws.onerror = () => { $('status').textContent = '✗ エラー'; };
}

async function load() {
  try {
    const r = await fetch('/api/streamers');
    all = await r.json();
    filtered = all;
    render();
    renderEditList();
  } catch { $('status').textContent = '✗ データ取得失敗'; }
}

function renderGojuon() {
  $('gojuon').innerHTML = '';
  gojuonChars.forEach(c => {
    const b = document.createElement('button');
    b.className = 'gbtn'; b.textContent = c;
    b.onclick = () => {
      document.querySelectorAll('.gbtn').forEach(x => x.classList.remove('active'));
      if (gFilter === c) { gFilter = null; filtered = all; }
      else { gFilter = c; b.classList.add('active');
        filtered = all.filter(s => (gojuonMap[c] || '').includes((s.yomi||'').charAt(0)));
      }
      $('search').value = '';
      render();
    };
    $('gojuon').appendChild(b);
  });
}

$('search').oninput = e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.gbtn').forEach(x => x.classList.remove('active'));
  gFilter = null;
  filtered = q ? all.filter(s => s.name.toLowerCase().includes(q) || (s.yomi||'').toLowerCase().includes(q)) : all;
  render();
};

function avatarHtml(s) {
  return s.photoUrl ? `<img class="av" src="${s.photoUrl}" alt="">` : `<div class="av no">📷</div>`;
}

function render() {
  const L = $('list'); L.innerHTML = '';
  if (!filtered.length) { L.innerHTML = '<div style="padding:18px;text-align:center;color:var(--dim)">該当なし</div>'; return; }
  filtered.forEach(s => {
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = avatarHtml(s) + `<div><div class="nm">${s.name}</div><div class="ym">${s.yomi||''}</div></div>`;
    d.onclick = () => {
      document.querySelectorAll('#list .item').forEach(x => x.classList.remove('sel'));
      d.classList.add('sel');
      send({type:'selectStreamer', streamerId:s.id});
    };
    L.appendChild(d);
  });
}

$('hideBtn').onclick = () => send({type:'hideStreamer'});
$('sc-up').onclick     = () => send({type:'scroll', dir:'up'});
$('sc-down').onclick   = () => send({type:'scroll', dir:'down'});
$('sc-top').onclick    = () => send({type:'scroll', dir:'top'});
$('sc-bottom').onclick = () => send({type:'scroll', dir:'bottom'});

function renderEditList() {
  const L = $('editList'); L.innerHTML = '';
  all.forEach(s => {
    const d = document.createElement('div');
    d.className = 'item' + (editing && editing.id === s.id ? ' sel' : '');
    d.innerHTML = avatarHtml(s) + `<div><div class="nm">${s.name}</div><div class="ym">${s.yomi||''}</div></div>`;
    d.onclick = () => loadToForm(s);
    L.appendChild(d);
  });
}

function blank() { return { id:'', name:'', yomi:'', photoUrl:'', sns:[], sites:[], intro:'' }; }

function loadToForm(s) {
  editing = JSON.parse(JSON.stringify(s));
  $('f-name').value = s.name || '';
  $('f-yomi').value = s.yomi || '';
  $('f-photo').value = (s.photoUrl && s.photoUrl.startsWith('data:')) ? '' : (s.photoUrl || '');
  $('f-intro').value = s.intro || '';
  $('preview').src = s.photoUrl || '';
  renderSns(); renderSites(); renderEditList();
  $('editStatus').textContent = s.name ? `編集中: ${s.name}` : '新規作成';
}

$('newBtn').onclick = () => { loadToForm(blank()); };
$('pickBtn').onclick = () => renderEditList();

function renderSns() {
  const W = $('snsWrap'); W.innerHTML = '';
  (editing.sns || []).forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'sub';
    d.innerHTML = `
      <input type="text" placeholder="プラットフォーム（X / YouTube等）" value="${x.platform||''}" data-k="platform" data-i="${i}">
      <input type="text" placeholder="ID（@name）" value="${x.id||''}" data-k="id" data-i="${i}">
      <input type="text" placeholder="URL" value="${x.url||''}" data-k="url" data-i="${i}">
      <button class="mini" data-del="${i}">削除</button>`;
    d.querySelectorAll('input').forEach(inp => {
      inp.oninput = e => { editing.sns[e.target.dataset.i][e.target.dataset.k] = e.target.value; };
    });
    d.querySelector('[data-del]').onclick = () => { editing.sns.splice(i,1); renderSns(); };
    W.appendChild(d);
  });
}
$('snsAdd').onclick = () => { if(!editing) editing = blank(); (editing.sns ||= []).push({platform:'',id:'',url:''}); renderSns(); };

function renderSites() {
  const W = $('siteWrap'); W.innerHTML = '';
  (editing.sites || []).forEach((x, i) => {
    const d = document.createElement('div'); d.className = 'sub';
    d.innerHTML = `
      <input type="text" placeholder="サイト名（ふわっち / Kick / ツイキャス）" value="${x.name||''}" data-k="name" data-i="${i}">
      <input type="text" placeholder="ID" value="${x.id||''}" data-k="id" data-i="${i}">
      <button class="mini" data-del="${i}">削除</button>`;
    d.querySelectorAll('input').forEach(inp => {
      inp.oninput = e => { editing.sites[e.target.dataset.i][e.target.dataset.k] = e.target.value; };
    });
    d.querySelector('[data-del]').onclick = () => { editing.sites.splice(i,1); renderSites(); };
    W.appendChild(d);
  });
}
$('siteAdd').onclick = () => { if(!editing) editing = blank(); (editing.sites ||= []).push({name:'',id:''}); renderSites(); };

$('imgBtn').onclick = () => $('imgFile').click();
$('imgFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const S = 256, cv = document.createElement('canvas');
      cv.width = S; cv.height = S;
      const ctx = cv.getContext('2d');
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
      const data = cv.toDataURL('image/jpeg', 0.85);
      if (!editing) editing = blank();
      editing.photoUrl = data;
      $('preview').src = data;
      $('f-photo').value = '';
      $('editStatus').textContent = '画像を取り込みました（保存を押してください）';
    };
    img.src = ev.target.result;
  };
  rd.readAsDataURL(f);
  e.target.value = '';
};
$('imgClear').onclick = () => { if(!editing) return; editing.photoUrl = ''; $('preview').src=''; $('f-photo').value=''; };
$('f-photo').oninput = e => { if(!editing) editing = blank(); editing.photoUrl = e.target.value; $('preview').src = e.target.value; };

$('saveBtn').onclick = async () => {
  if (!editing) { $('editStatus').textContent = '編集対象がありません'; return; }
  editing.name = $('f-name').value.trim();
  editing.yomi = $('f-yomi').value.trim();
  editing.intro = $('f-intro').value;
  if (!editing.name) { $('editStatus').textContent = '配信者名は必須です'; return; }

  if (!editing.id) {
    editing.id = 'streamer_' + Date.now();
    all.push(editing);
  } else {
    const i = all.findIndex(s => s.id === editing.id);
    if (i >= 0) all[i] = editing; else all.push(editing);
  }
  await push();
};

$('delBtn').onclick = async () => {
  if (!editing || !editing.id) return;
  if (!confirm(`${editing.name} を削除しますか？`)) return;
  all = all.filter(s => s.id !== editing.id);
  loadToForm(blank());
  await push();
};

async function push() {
  try {
    const r = await fetch('/api/streamers', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(all)
    });
    const j = await r.json();
    $('editStatus').textContent = j.ok ? `保存しました（${j.count}件）` : '保存失敗';
    filtered = all; render(); renderEditList();
  } catch (err) {
    $('editStatus').textContent = '保存エラー: ' + err.message;
  }
}

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(all, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'streamers.json';
  a.click();
};

function bgRGB(level){
  const t = Math.max(0, Math.min(100, level)) / 100;
  return [Math.round(12 + t*52), Math.round(14 + t*54), Math.round(18 + t*60)];
}

function sendSettings() {
  const st = {
    width: +$('s-width').value,
    bgOpacity: +$('s-bg').value / 100,
    bgLevel: +$('s-lvl').value,
    fontScale: +$('s-font').value
  };
  $('v-width').textContent = st.width + 'px';
  $('v-bg').textContent = $('s-bg').value + '%';
  $('v-lvl').textContent = st.bgLevel;
  $('v-font').textContent = st.fontScale.toFixed(2) + 'x';
  const [r,g,b] = bgRGB(st.bgLevel);
  $('swatch').style.background = `rgba(${r},${g},${b},${st.bgOpacity})`;
  send({type:'updateSettings', settings:st});
}

function applySettingsUI(st) {
  if (!st) return;
  $('s-width').value = st.width;
  $('s-bg').value = Math.round((st.bgOpacity ?? 0.85) * 100);
  $('s-lvl').value = st.bgLevel ?? 12;
  $('s-font').value = st.fontScale ?? 1;
  $('v-width').textContent = st.width + 'px';
  $('v-bg').textContent = $('s-bg').value + '%';
  $('v-lvl').textContent = $('s-lvl').value;
  $('v-font').textContent = (+$('s-font').value).toFixed(2) + 'x';
  const [r,g,b] = bgRGB(+$('s-lvl').value);
  $('swatch').style.background = `rgba(${r},${g},${b},${+$('s-bg').value/100})`;
}

['s-width','s-bg','s-lvl','s-font'].forEach(id => $(id).oninput = sendSettings);

editing = blank();
connect(); load(); renderGojuon(); sendSettings();
</script>
</body>
</html>
