<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信者図鑑 Overlay</title>
<style>
html,body{width:1280px;height:720px;margin:0;background:transparent;color:#ECE4D4;font-family:sans-serif;overflow:hidden}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;color:#E8A33D;font:12px monospace;letter-spacing:.2em}
#boot.err{background:rgba(11,14,20,.92);color:#E2566B;letter-spacing:.08em;padding:30px;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div id="boot">LOADING STREAMER ARCHIVE</div>
<script>
(async function(){
  const BASE_OVERLAY = 'https://raw.githubusercontent.com/URA-NEWS/ura-streamer-dic-overlay/c4cbd587cf670e410f899c66d8bbd3b8ddf7cdd8/streamer_dic_overlay.html';
  const IMAGE_BASE = 'https://lcnuxfvjownsmqvuagkd.supabase.co/storage/v1/object/public/site/streamer-dic/korekore/timeline/';
  const IMAGES = {
    'タバコのポイ捨て注意企画で知られる': '01-tobacco-littering.webp',
    '本田翼・ねこてん配信へのコレリス突撃で荒らし誘導疑惑': '02-comment-raid.webp',
    'アイドルグループ Kore:ct を結成': '03-korect-formation.webp',
    'ぷぅさんの女性関係を配信で話し、3年間絶縁': '04-pusan-break.webp',
    'へずまりゅう話を信じてがーどまんを一方的に批判、早とちり炎上': '05-hezuma-guardman.webp',
    'X/Twitter本アカウントが虚偽通報で凍結': '06-twitter-freeze.webp',
    '初書籍『告発』発売': '07-book-kokuhatsu.webp',
    '民放ドラマ初出演、SNSの存在感が地上波ドラマへ': '08-tv-drama.webp',
    'TikTok LIVE提携事務所『Korective』を設立': '09-korective.webp',
    '有馬記念で600万円全ロスとして話題化': '10-arima-600man.webp',
    'TikTok盾イベントの不正行為を告発、TikTok引退も示唆': '11-tiktok-shield.webp',
    '大阪万博を辛口レポート、生配信ルール錯綜に困惑': '12-expo-2025.webp',
    'くら寿司“避妊具テロ”関係者がコレコレ配信に出演していた件が後日報道': '13-kurasushi.webp',
    '120kg・肉離れ・車椅子生活を投稿しダイエット宣言': '14-wheelchair-diet.webp',
    '『結婚します』投稿で祝福と疑念が殺到': '15-marriage-post.webp',
    '結婚発表は『結婚相手募集』企画のフリだったと判明': '16-marriage-program.webp',
    'アインシュタイン稲田DM疑惑で不正ログイン犯逮捕、コレコレが謝罪・自粛表明': '17-inada-apology.webp',
    '緊急生放送で『今炎上中なんでね、僕』と釈明': '18-inada-stream.webp',
    '多屋来夢との性的関係をKICK配信で告白': '19-taya-raimu.webp'
  };

  function escJs(s){
    return String(s).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
  }

  function buildPatch(){
    let lines = [];
    lines.push('const KOREKORE_TIMELINE_IMAGES = {');
    Object.entries(IMAGES).forEach(([title, file]) => {
      lines.push(`  \`${escJs(title)}\`: \`${file}\`,`);
    });
    lines.push('};');
    lines.push('function timelineImageOverride(s, e){');
    lines.push("  if (!s || s.id !== 'korekore') return ''; ");
    lines.push("  const file = KOREKORE_TIMELINE_IMAGES[String(e.title || '')];");
    lines.push("  return file ? '" + IMAGE_BASE + "' + file : ''; ");
    lines.push('}');
    return lines.join('\n');
  }

  function patch(html){
    html = html.replace(/const APP_VERSION = '[^']+';/, "const APP_VERSION = '2026-09-05-uploaded-korekore-images';");
    html = html.replace(/let figNo = 0;/, buildPatch() + '\n\nlet figNo = 0;');
    const oldBlock = /const th = ytThumb\(e\.url\);\s*if \(!badTimelineImage\(e\)\)\{\s*h \+= fig\(e\.imageUrl, e\.date \|\| ''\);\s*\} else if \(th\) \{\s*h \+= fig\(th, 'YOUTUBE'\);\s*\}/;
    const newBlock = "const imageOverride = timelineImageOverride(s, e);\n      const imageUrl = imageOverride || e.imageUrl;\n      const th = ytThumb(e.url);\n      if (imageOverride || !badTimelineImage(Object.assign({}, e, { imageUrl }))){\n        h += fig(imageUrl, e.date || '');\n      } else if (th) {\n        h += fig(th, 'YOUTUBE');\n      }";
    if (!oldBlock.test(html)) throw new Error('timeline image block was not found');
    return html.replace(oldBlock, newBlock);
  }

  try {
    const r = await fetch(BASE_OVERLAY, { cache: 'no-store' });
    if (!r.ok) throw new Error('base overlay fetch failed: ' + r.status);
    const html = patch(await r.text());
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    const boot = document.getElementById('boot');
    boot.className = 'err';
    boot.textContent = 'オーバーレイを読み込めませんでした: ' + err.message;
  }
})();
</script>
</body>
</html>
