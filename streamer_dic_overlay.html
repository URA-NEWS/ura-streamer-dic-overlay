<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信者図鑑 Overlay</title>
<style>
:root{
  --line:#3a5c88; --cyan:#12f5ff; --cyan-soft:#7cfbff;
  --green:#39ff9d; --gold:#ffd24a; --text:#fff; --dim:#dbe8f8;
  --w:640px; --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:transparent;overflow:hidden;
  font-family:'Noto Sans JP',sans-serif}
.wrap{
  position:fixed;top:0;right:0;width:var(--w);height:720px;
  background:rgba(18,20,26,0.88);
  border-left:3px solid var(--line);
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1), width .2s ease, background-color .12s linear;
  display:flex;flex-direction:column;z-index:9999
}
.wrap.on{transform:translateX(0)}
.hd{padding:16px 24px;border-bottom:3px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hd h2{font-size:calc(22px * var(--fs));color:var(--cyan);font-weight:700;letter-spacing:.08em}
.bd{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.bd, .hd{text-shadow:0 2px 8px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9)}
.photo-wrap{display:flex;justify-content:center;margin-bottom:16px}
.photo{width:calc(170px * var(--fs));height:calc(170px * var(--fs));border-radius:50%;
  object-fit:cover;border:4px solid var(--green);box-shadow:0 0 28px rgba(57,255,157,.4);
  background:rgba(12,24,48,.7)}
.photo.no{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:calc(70px * var(--fs))}
.name{font-size:calc(46px * var(--fs));font-weight:900;text-align:center;line-height:1.15;
  color:var(--gold);
  text-shadow:0 3px 10px rgba(0,0,0,1), 0 0 18px rgba(255,180,40,.45), 0 0 3px rgba(0,0,0,1)}
.yomi{font-size:calc(22px * var(--fs));color:var(--dim);text-align:center;margin-top:6px}
.sec{border-top:2px solid var(--line);padding-top:16px;margin-top:20px}
.lbl{font-size:calc(17px * var(--fs));color:var(--green);font-weight:700;letter-spacing:.12em;margin-bottom:12px}
.info{display:flex;flex-direction:column;gap:11px}
.info-row{display:flex;gap:14px;align-items:flex-start;font-size:calc(23px * var(--fs))}
.info-row b{color:var(--cyan-soft);min-width:calc(140px * var(--fs));font-weight:700;flex-shrink:0}
.info-row span{color:#fff;font-weight:500}
.sns{display:flex;gap:10px;flex-wrap:wrap}
.sns a{display:inline-flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.45);
  border:2px solid var(--line);border-radius:10px;padding:10px 16px;
  color:var(--cyan-soft);font-size:calc(21px * var(--fs));text-decoration:none;font-weight:700}
.sites{display:flex;flex-direction:column;gap:12px}
.site{display:flex;gap:14px;align-items:center;font-size:calc(24px * var(--fs))}
.site b{color:var(--text);min-width:calc(120px * var(--fs));font-weight:700}
.site span{color:var(--cyan-soft);font-weight:700}
.videos{display:flex;flex-direction:column;gap:12px}
.video-item{padding-left:16px;border-left:4px solid var(--gold)}
.video-title{font-size:calc(23px * var(--fs));color:#fff;font-weight:600;line-height:1.4}
.video-url{font-size:calc(17px * var(--fs));color:var(--cyan-soft);font-weight:600;
  margin-top:4px;word-break:break-all;line-height:1.4}
.intro{font-size:calc(24px * var(--fs));color:#fff;line-height:1.75;font-weight:600}
.bd::-webkit-scrollbar{width:8px}
.bd::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
.bd::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}

.player{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:10000;
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.player.on{display:flex}
.player-title{color:var(--gold);font-size:26px;font-weight:700;margin-bottom:16px;
  text-align:center;max-width:1100px;text-shadow:0 2px 8px rgba(0,0,0,1)}
.player-frame{width:1120px;height:630px;border:none;background:#000;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hd"><h2>配信者情報</h2></div>
  <div class="bd" id="bd"></div>
</div>

<div class="player" id="player">
  <div class="player-title" id="playerTitle"></div>
  <iframe class="player-frame" id="playerFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<script>
const wrap = document.getElementById('wrap');
const bd = document.getElementById('bd');
const player = document.getElementById('player');
const playerFrame = document.getElementById('playerFrame');
const playerTitle = document.getElementById('playerTitle');
let ws = null;
let cur = { width:640, bgOpacity:0.88, bgLevel:12, fontScale:1 };

function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({type:'init', clientType:'overlay'}));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ack' && m.settings) applySettings(m.settings);
    if (m.type === 'settings') applySettings(m.settings);
    if (m.type === 'showStreamer') { stopVideo(); show(m.streamer); }
    if (m.type === 'hideOverlay') { stopVideo(); wrap.classList.remove('on'); }
    if (m.type === 'scroll') doScroll(m.dir);
    if (m.type === 'playVideo') playVideo(m.url, m.title);
    if (m.type === 'stopVideo') stopVideo();
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function isX(u){
  try {
    const h = new URL(u).hostname.replace('www.','');
    return h === 'x.com' || h === 'twitter.com' || h === 'mobile.twitter.com';
  } catch { return false; }
}

function embedUrl(u){
  if (!u) return '';
  try {
    const url = new URL(u);
    const h = url.hostname.replace('www.','');
    if (h === 'youtube.com' || h === 'm.youtube.com'){
      const v = url.searchParams.get('v');
      if (v) return `https://www.youtube.com/embed/${v}?autoplay=1&rel=0`;
      if (url.pathname.startsWith('/live/')) return `https://www.youtube.com/embed/${url.pathname.split('/')[2]}?autoplay=1&rel=0`;
      if (url.pathname.startsWith('/shorts/')) return `https://www.youtube.com/embed/${url.pathname.split('/')[2]}?autoplay=1&rel=0`;
      if (url.pathname.startsWith('/embed/')) return u;
    }
    if (h === 'youtu.be') return `https://www.youtube.com/embed/${url.pathname.slice(1)}?autoplay=1&rel=0`;
    if (h === 'twitcasting.tv'){
      const parts = url.pathname.split('/').filter(Boolean);
      if (parts.length >= 3 && parts[1] === 'movie') return `https://twitcasting.tv/${parts[0]}/embeddedplayer/${parts[2]}?auto_play=true`;
    }
    if (h === 'kick.com'){
      const parts = url.pathname.split('/').filter(Boolean);
      if (parts.length >= 3 && parts[1] === 'videos') return `https://player.kick.com/video/${parts[2]}?autoplay=true`;
      if (parts.length === 1) return `https://player.kick.com/${parts[0]}?autoplay=true`;
    }
    return u;
  } catch { return u; }
}

function playVideo(u, title){
  if (!u || isX(u)) return;
  const src = embedUrl(u);
  if (!src) return;
  playerTitle.textContent = title || '';
  playerFrame.src = src;
  player.classList.add('on');
}

function stopVideo(){
  playerFrame.src = '';
  player.classList.remove('on');
}

function doScroll(dir){
  const step = Math.round(bd.clientHeight * 0.35);
  if (dir === 'up') bd.scrollTop -= step;
  else if (dir === 'down') bd.scrollTop += step;
  else if (dir === 'top') bd.scrollTop = 0;
  else if (dir === 'bottom') bd.scrollTop = bd.scrollHeight;
}

function applySettings(st){
  if (!st) return;
  cur = Object.assign(cur, st);
  const r = document.documentElement.style;
  r.setProperty('--w', cur.width + 'px');
  r.setProperty('--fs', cur.fontScale);
  const t = Math.max(0, Math.min(100, cur.bgLevel)) / 100;
  const R = Math.round(10 + t * 62);
  const G = Math.round(12 + t * 64);
  const B = Math.round(16 + t * 70);
  const raw = Math.max(0, Math.min(1, cur.bgOpacity));
  const a = Math.pow(raw, 0.45);
  wrap.style.backgroundColor = `rgba(${R},${G},${B},${a.toFixed(3)})`;
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function show(s){
  let h = '';
  h += '<div class="photo-wrap">' + (s.photoUrl
    ? `<img class="photo" src="${esc(s.photoUrl)}" alt="">`
    : `<div class="photo no">📷</div>`) + '</div>';
  h += `<div class="name">${esc(s.name)}</div>`;
  if (s.yomi) h += `<div class="yomi">${esc(s.yomi)}</div>`;

  const infoRows = [
    ['活動期間', s.activePeriod],
    ['配信スタイル', s.style],
    ['生年月日 / 年齢', s.birth],
    ['出身地', s.origin]
  ].filter(x => x[1]);
  if (infoRows.length){
    h += '<div class="sec"><div class="lbl">配信者情報</div><div class="info">';
    infoRows.forEach(([k,v]) => {
      h += `<div class="info-row"><b>${k}</b><span>${esc(v)}</span></div>`;
    });
    h += '</div></div>';
  }

  if (s.sns && s.sns.length){
    h += '<div class="sec"><div class="lbl">SNS</div><div class="sns">';
    s.sns.forEach(x => {
      h += `<a href="${esc(x.url)}" target="_blank" rel="noopener"><span>${esc(x.platform)}</span><span>${esc(x.id)}</span></a>`;
    });
    h += '</div></div>';
  }

  if (s.sites && s.sites.length){
    h += '<div class="sec"><div class="lbl">配信サイト</div><div class="sites">';
    s.sites.forEach(x => {
      h += `<div class="site"><b>${esc(x.name)}</b><span>${esc(x.id)}</span></div>`;
    });
    h += '</div></div>';
  }

  if (s.videos && s.videos.length){
    h += '<div class="sec"><div class="lbl">代表的配信</div><div class="videos">';
    s.videos.forEach(x => {
      if (!x.title && !x.url) return;
      h += '<div class="video-item">';
      if (x.title) h += `<div class="video-title">${esc(x.title)}</div>`;
      if (isX(x.url)) h += `<div class="video-url">${esc(x.url)}</div>`;
      h += '</div>';
    });
    h += '</div></div>';
  }

  if (s.intro){
    h += `<div class="sec"><div class="lbl">紹介</div><div class="intro">${esc(s.intro)}</div></div>`;
  }

  bd.innerHTML = h;
  bd.scrollTop = 0;
  wrap.classList.add('on');
}

applySettings(cur);
connect();
</script>
</body>
</html>
