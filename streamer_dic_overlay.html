<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamer Dictionary Overlay</title>
  <style>
    :root {
      --bg: #04060d;
      --panel: #0c1830;
      --panel-2: #12233f;
      --line: #2a4468;
      --cyan: #12f5ff;
      --cyan-soft: #7cfbff;
      --magenta: #ff2fb0;
      --green: #39ff9d;
      --text: #fff;
      --text-dim: #cfe0f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1280px;
      height: 720px;
      background: transparent;
      overflow: hidden;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .overlay-container {
      position: fixed;
      top: 0;
      right: 0;
      width: 640px;
      height: 720px;
      background: linear-gradient(90deg, rgba(4, 6, 13, 0) 0%, var(--panel) 15%, var(--panel-2) 100%);
      border-left: 2px solid var(--line);
      transform: translateX(640px);
      transition: transform 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
      display: flex;
      flex-direction: column;
      z-index: 9999;
    }

    .overlay-container.visible {
      transform: translateX(0);
    }

    .overlay-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .overlay-header h2 {
      font-size: 16px;
      color: var(--cyan);
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 20px;
      cursor: pointer;
      transition: 0.15s;
    }

    .close-btn:hover {
      color: var(--magenta);
    }

    .overlay-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .streamer-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .streamer-photo-section {
      display: flex;
      justify-content: center;
    }

    .streamer-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--green);
      box-shadow: 0 0 20px rgba(57, 255, 157, 0.3);
    }

    .streamer-photo.noimg {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      color: var(--text-dim);
      font-size: 60px;
    }

    .streamer-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      line-height: 1.2;
    }

    .streamer-yomi {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      font-family: 'Space Mono', monospace;
    }

    .streamer-section {
      border-top: 1px dashed var(--line);
      padding-top: 12px;
    }

    .section-label {
      font-size: 12px;
      color: var(--green);
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .sns-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sns-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 12px;
      color: var(--text-dim);
      font-size: 12px;
      text-decoration: none;
      transition: 0.15s;
      cursor: pointer;
    }

    .sns-link:hover {
      border-color: var(--cyan);
      color: var(--cyan-soft);
    }

    .sites-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
    }

    .site-item {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--text-dim);
    }

    .site-name {
      font-weight: 600;
      color: var(--text);
      min-width: 70px;
    }

    .site-id {
      color: var(--cyan-soft);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .intro-text {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    /* スクロールバースタイル */
    .overlay-body::-webkit-scrollbar {
      width: 6px;
    }

    .overlay-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .overlay-body::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }

    .overlay-body::-webkit-scrollbar-thumb:hover {
      background: var(--cyan);
    }
  </style>
</head>
<body>
  <div class="overlay-container" id="overlayContainer">
    <div class="overlay-header">
      <h2>配信者情報</h2>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>
    <div class="overlay-body" id="overlayBody">
      <!-- 動的に配信者情報が挿入される -->
    </div>
  </div>

  <script>
    const overlayContainer = document.getElementById('overlayContainer');
    const overlayBody = document.getElementById('overlayBody');
    const closeBtn = document.getElementById('closeBtn');

    let ws = null;

    // WebSocket接続
    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'init', clientType: 'overlay' }));
      };

      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'showStreamer') {
          displayStreamer(msg.streamer);
        } else if (msg.type === 'hideOverlay') {
          hideOverlay();
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
      };
    }

    // 配信者情報表示
    function displayStreamer(streamer) {
      overlayBody.innerHTML = '';

      // 写真
      const photoSection = document.createElement('div');
      photoSection.className = 'streamer-photo-section';
      if (streamer.photoUrl) {
        const photo = document.createElement('img');
        photo.className = 'streamer-photo';
        photo.src = streamer.photoUrl;
        photo.alt = streamer.name;
        photoSection.appendChild(photo);
      } else {
        const photo = document.createElement('div');
        photo.className = 'streamer-photo noimg';
        photo.textContent = '📷';
        photoSection.appendChild(photo);
      }
      overlayBody.appendChild(photoSection);

      // 名前
      const nameEl = document.createElement('div');
      nameEl.className = 'streamer-name';
      nameEl.textContent = streamer.name;
      overlayBody.appendChild(nameEl);

      // 読み仮名
      if (streamer.yomi) {
        const yomiEl = document.createElement('div');
        yomiEl.className = 'streamer-yomi';
        yomiEl.textContent = streamer.yomi;
        overlayBody.appendChild(yomiEl);
      }

      // SNS
      if (streamer.sns && streamer.sns.length > 0) {
        const snsSection = document.createElement('div');
        snsSection.className = 'streamer-section';
        snsSection.innerHTML = '<div class="section-label">SNS</div>';
        const snsLinks = document.createElement('div');
        snsLinks.className = 'sns-links';
        streamer.sns.forEach(link => {
          const a = document.createElement('a');
          a.className = 'sns-link';
          a.href = link.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.innerHTML = `<span>${link.platform}</span><span>${link.id}</span>`;
          snsLinks.appendChild(a);
        });
        snsSection.appendChild(snsLinks);
        overlayBody.appendChild(snsSection);
      }

      // 配信サイト
      if (streamer.sites && streamer.sites.length > 0) {
        const sitesSection = document.createElement('div');
        sitesSection.className = 'streamer-section';
        sitesSection.innerHTML = '<div class="section-label">配信サイト</div>';
        const sitesList = document.createElement('div');
        sitesList.className = 'sites-list';
        streamer.sites.forEach(site => {
          const item = document.createElement('div');
          item.className = 'site-item';
          item.innerHTML = `<span class="site-name">${site.name}</span><span class="site-id">${site.id}</span>`;
          sitesList.appendChild(item);
        });
        sitesSection.appendChild(sitesList);
        overlayBody.appendChild(sitesSection);
      }

      // 紹介文
      if (streamer.intro) {
        const introSection = document.createElement('div');
        introSection.className = 'streamer-section';
        introSection.innerHTML = '<div class="section-label">紹介</div>';
        const introText = document.createElement('div');
        introText.className = 'intro-text';
        introText.textContent = streamer.intro;
        introSection.appendChild(introText);
        overlayBody.appendChild(introSection);
      }

      // スライドイン
      overlayContainer.classList.add('visible');
    }

    // オーバーレイ非表示
    function hideOverlay() {
      overlayContainer.classList.remove('visible');
    }

    closeBtn.addEventListener('click', hideOverlay);

    // 初期化
    connectWebSocket();
  </script>
</body>
</html>
