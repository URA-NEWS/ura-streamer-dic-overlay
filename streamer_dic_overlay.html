<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信者図鑑 Overlay</title>
<style>
:root{
  --line:#3a5c88; --cyan:#12f5ff; --cyan-soft:#7cfbff;
  --green:#39ff9d; --gold:#ffd24a; --text:#fff; --dim:#dbe8f8;
  --w:640px; --fs:1;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:transparent;overflow:hidden;
  font-family:'Noto Sans JP',sans-serif}
.wrap{
  position:fixed;top:0;right:0;width:var(--w);height:720px;
  background:rgba(18,20,26,0.88);
  border-left:3px solid var(--line);
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1), width .2s ease, background-color .12s linear;
  display:flex;flex-direction:column;z-index:9999
}
.wrap.on{transform:translateX(0)}
.hd{padding:16px 24px;border-bottom:3px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hd h2{font-size:calc(22px * var(--fs));color:var(--cyan);font-weight:700;letter-spacing:.08em}
.bd{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth}
.bd, .hd{text-shadow:0 2px 8px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9)}
.photo-wrap{display:flex;justify-content:center;margin-bottom:16px}
.photo{width:calc(170px * var(--fs));height:calc(170px * var(--fs));border-radius:50%;
  object-fit:cover;border:4px solid var(--green);box-shadow:0 0 28px rgba(57,255,157,.4);
  background:rgba(12,24,48,.7)}
.photo.no{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:calc(70px * var(--fs))}
.name{font-size:calc(46px * var(--fs));font-weight:900;text-align:center;line-height:1.15;
  color:var(--gold);
  text-shadow:0 3px 10px rgba(0,0,0,1), 0 0 18px rgba(255,180,40,.45), 0 0 3px rgba(0,0,0,1)}
.yomi{font-size:calc(22px * var(--fs));color:var(--dim);text-align:center;margin-top:6px}
.sec{border-top:2px solid var(--line);padding-top:16px;margin-top:20px}
.lbl{font-size:calc(17px * var(--fs));color:var(--green);font-weight:700;letter-spacing:.12em;margin-bottom:12px}
.sns{display:flex;gap:10px;flex-wrap:wrap}
.sns a{display:inline-flex;align-items:center;gap:10px;
  background:rgba(0,0,0,.45);
  border:2px solid var(--line);border-radius:10px;padding:10px 16px;
  color:var(--cyan-soft);font-size:calc(21px * var(--fs));text-decoration:none;font-weight:700}
.sites{display:flex;flex-direction:column;gap:12px}
.site{display:flex;gap:14px;align-items:center;font-size:calc(24px * var(--fs))}
.site b{color:var(--text);min-width:calc(120px * var(--fs));font-weight:700}
.site span{color:var(--cyan-soft);font-weight:700}
.intro{font-size:calc(24px * var(--fs));color:#fff;line-height:1.75}
.bd::-webkit-scrollbar{width:8px}
.bd::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
.bd::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hd"><h2>配信者情報</h2></div>
  <div class="bd" id="bd"></div>
</div>

<script>
const wrap = document.getElementById('wrap');
const bd = document.getElementById('bd');
let ws = null;
let cur = { width:640, bgOpacity:0.88, bgLevel:12, fontScale:1 };

function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({type:'init', clientType:'overlay'}));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ack' && m.settings) applySettings(m.settings);
    if (m.type === 'settings') applySettings(m.settings);
    if (m.type === 'showStreamer') show(m.streamer);
    if (m.type === 'hideOverlay') wrap.classList.remove('on');
    if (m.type === 'scroll') doScroll(m.dir);
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function doScroll(dir){
  const step = Math.round(bd.clientHeight * 0.35);
  if (dir === 'up') bd.scrollTop -= step;
  else if (dir === 'down') bd.scrollTop += step;
  else if (dir === 'top') bd.scrollTop = 0;
  else if (dir === 'bottom') bd.scrollTop = bd.scrollHeight;
}

function applySettings(st){
  if (!st) return;
  cur = Object.assign(cur, st);
  const r = document.documentElement.style;
  r.setProperty('--w', cur.width + 'px');
  r.setProperty('--fs', cur.fontScale);

  // 明るさ 0=rgb(10,12,16) 〜 100=rgb(72,76,86)
  const t = Math.max(0, Math.min(100, cur.bgLevel)) / 100;
  const R = Math.round(10 + t * 62);
  const G = Math.round(12 + t * 64);
  const B = Math.round(16 + t * 70);

  // 体感に合わせたガンマ補正（50%→約0.73）
  const raw = Math.max(0, Math.min(1, cur.bgOpacity));
  const a = Math.pow(raw, 0.45);

  wrap.style.backgroundColor = `rgba(${R},${G},${B},${a.toFixed(3)})`;
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function show(s){
  let h = '';
  h += '<div class="photo-wrap">' + (s.photoUrl
    ? `<img class="photo" src="${esc(s.photoUrl)}" alt="">`
    : `<div class="photo no">📷</div>`) + '</div>';
  h += `<div class="name">${esc(s.name)}</div>`;
  if (s.yomi) h += `<div class="yomi">${esc(s.yomi)}</div>`;

  if (s.sns && s.sns.length){
    h += '<div class="sec"><div class="lbl">SNS</div><div class="sns">';
    s.sns.forEach(x => {
      h += `<a href="${esc(x.url)}" target="_blank" rel="noopener"><span>${esc(x.platform)}</span><span>${esc(x.id)}</span></a>`;
    });
    h += '</div></div>';
  }

  if (s.sites && s.sites.length){
    h += '<div class="sec"><div class="lbl">配信サイト</div><div class="sites">';
    s.sites.forEach(x => {
      h += `<div class="site"><b>${esc(x.name)}</b><span>${esc(x.id)}</span></div>`;
    });
    h += '</div></div>';
  }

  if (s.intro){
    h += `<div class="sec"><div class="lbl">紹介</div><div class="intro">${esc(s.intro)}</div></div>`;
  }

  bd.innerHTML = h;
  bd.scrollTop = 0;
  wrap.classList.add('on');
}

applySettings(cur);
connect();
</script>
</body>
</html>
