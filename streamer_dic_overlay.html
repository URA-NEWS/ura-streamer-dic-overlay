<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>配信者図鑑 Overlay</title>
<style>
:root{
  --line:#2a4468; --cyan:#12f5ff; --cyan-soft:#7cfbff;
  --green:#39ff9d; --text:#fff; --dim:#cfe0f5;
  --w:640px; --bgop:0.85; --fs:1;
  --bg-r:18; --bg-g:20; --bg-b:26;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;background:transparent;overflow:hidden;
  font-family:'Noto Sans JP',sans-serif}
.wrap{
  position:fixed;top:0;right:0;width:var(--w);height:720px;
  background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),var(--bgop));
  border-left:2px solid var(--line);
  transform:translateX(100%);
  transition:transform .4s cubic-bezier(.4,0,.2,1), width .2s ease, background-color .15s linear;
  display:flex;flex-direction:column;z-index:9999
}
.wrap.on{transform:translateX(0)}
.hd{padding:16px 22px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.hd h2{font-size:calc(20px * var(--fs));color:var(--cyan);font-weight:700;letter-spacing:.06em;
  text-shadow:0 2px 6px rgba(0,0,0,.9)}
.bd{flex:1;overflow-y:auto;padding:22px;scroll-behavior:smooth}
.bd, .bd *{text-shadow:0 2px 6px rgba(0,0,0,.9)}
.photo-wrap{display:flex;justify-content:center;margin-bottom:14px}
.photo{width:calc(160px * var(--fs));height:calc(160px * var(--fs));border-radius:50%;
  object-fit:cover;border:3px solid var(--green);box-shadow:0 0 24px rgba(57,255,157,.35);
  background:rgba(12,24,48,.6)}
.photo.no{display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:calc(64px * var(--fs))}
.name{font-size:calc(38px * var(--fs));font-weight:700;text-align:center;line-height:1.2}
.yomi{font-size:calc(18px * var(--fs));color:var(--dim);text-align:center;margin-top:4px}
.sec{border-top:1px dashed var(--line);padding-top:14px;margin-top:16px}
.lbl{font-size:calc(15px * var(--fs));color:var(--green);font-weight:700;letter-spacing:.1em;margin-bottom:10px}
.sns{display:flex;gap:8px;flex-wrap:wrap}
.sns a{display:inline-flex;align-items:center;gap:8px;
  background:rgba(var(--bg-r),var(--bg-g),var(--bg-b),.75);
  border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  color:var(--dim);font-size:calc(18px * var(--fs));text-decoration:none}
.sites{display:flex;flex-direction:column;gap:10px}
.site{display:flex;gap:12px;align-items:center;font-size:calc(20px * var(--fs))}
.site b{color:var(--text);min-width:calc(110px * var(--fs))}
.site span{color:var(--cyan-soft)}
.intro{font-size:calc(20px * var(--fs));color:var(--dim);line-height:1.7}
.bd::-webkit-scrollbar{width:6px}
.bd::-webkit-scrollbar-track{background:transparent}
.bd::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="hd"><h2>配信者情報</h2></div>
  <div class="bd" id="bd"></div>
</div>

<script>
const wrap = document.getElementById('wrap');
const bd = document.getElementById('bd');
let ws = null;

function connect(){
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(proto + '//' + location.host);
  ws.onopen = () => ws.send(JSON.stringify({type:'init', clientType:'overlay'}));
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'ack' && m.settings) applySettings(m.settings);
    if (m.type === 'settings') applySettings(m.settings);
    if (m.type === 'showStreamer') show(m.streamer);
    if (m.type === 'hideOverlay') wrap.classList.remove('on');
    if (m.type === 'scroll') doScroll(m.dir);
  };
  ws.onclose = () => setTimeout(connect, 3000);
}

function doScroll(dir){
  const step = Math.round(bd.clientHeight * 0.35);
  if (dir === 'up') bd.scrollTop -= step;
  else if (dir === 'down') bd.scrollTop += step;
  else if (dir === 'top') bd.scrollTop = 0;
  else if (dir === 'bottom') bd.scrollTop = bd.scrollHeight;
}

function applySettings(st){
  if (!st) return;
  const r = document.documentElement.style;
  if (st.width != null) r.setProperty('--w', st.width + 'px');
  if (st.bgOpacity != null) r.setProperty('--bgop', st.bgOpacity);
  if (st.fontScale != null) r.setProperty('--fs', st.fontScale);
  if (st.bgLevel != null){
    const t = Math.max(0, Math.min(100, st.bgLevel)) / 100;
    r.setProperty('--bg-r', Math.round(12 + t * 52));
    r.setProperty('--bg-g', Math.round(14 + t * 54));
    r.setProperty('--bg-b', Math.round(18 + t * 60));
  }
}

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function show(s){
  let h = '';
  h += '<div class="photo-wrap">' + (s.photoUrl
    ? `<img class="photo" src="${esc(s.photoUrl)}" alt="">`
    : `<div class="photo no">📷</div>`) + '</div>';
  h += `<div class="name">${esc(s.name)}</div>`;
  if (s.yomi) h += `<div class="yomi">${esc(s.yomi)}</div>`;

  if (s.sns && s.sns.length){
    h += '<div class="sec"><div class="lbl">SNS</div><div class="sns">';
    s.sns.forEach(x => {
      h += `<a href="${esc(x.url)}" target="_blank" rel="noopener"><span>${esc(x.platform)}</span><span>${esc(x.id)}</span></a>`;
    });
    h += '</div></div>';
  }

  if (s.sites && s.sites.length){
    h += '<div class="sec"><div class="lbl">配信サイト</div><div class="sites">';
    s.sites.forEach(x => {
      h += `<div class="site"><b>${esc(x.name)}</b><span>${esc(x.id)}</span></div>`;
    });
    h += '</div></div>';
  }

  if (s.intro){
    h += `<div class="sec"><div class="lbl">紹介</div><div class="intro">${esc(s.intro)}</div></div>`;
  }

  bd.innerHTML = h;
  bd.scrollTop = 0;
  wrap.classList.add('on');
}

connect();
</script>
</body>
</html>
